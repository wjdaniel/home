<!DOCTYPE html>
<html>
<head>
  <title>Themes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
</head>
<body>
  <style>
    body {
      background-color: #A4BED5FF; 
      margin: 0;
      font-family: Tahoma, sans-serif;
    }
    
    .header {
      background-color: #023743FF; 
      display: flex;
      justify-content: space-between; 
      align-items: center;            
      margin: 0;
      padding: 0 30px;      
    }

    .header-brand {
      color: #FFFFFF;
      text-decoration: none;
      font-size: 18px;
      font-weight: normal;
      letter-spacing: 1px;
      font-family: Tahoma;
      font-style: normal;
    }

    .header-nav {
      display: flex;
    }

    .header-button {
      color: white;
      background-color: #023743FF; 
      border: none;
      padding: 30px;
      font-size: 18px;
      font-family: Tahoma;
      font-style: normal;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.5s ease, border-radius 0.5s ease;
    }

    .header-button:hover {
      background-color: #476F84FF;
      border-radius: 10px;
    }

    .content-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      box-sizing: border-box;
    }


    .page-title {
      font-size: 3rem;
      text-align: center;
      color: #023743FF;
      margin-top: 20px;
      margin-bottom: 50px;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)); 
      gap: 40px 20px; 
      }

    .theme-column {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .theme-column:nth-child(4) {
      grid-column: 1 / 2;
    }
  
    @media (min-width: 768px) {
      .theme-column:nth-child(4) {
        grid-column: 2; 
      }
      .theme-column:nth-child(5) {
        grid-column: 3; 
      }
    }
    .image-link {
      width: 100%;
      aspect-ratio: 1 / 1; 
      display: block;
      overflow: hidden;
      border-radius: 8px; 
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); 
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      margin-bottom: 20px;
    }

    .image-link:hover {
      transform: translateY(-10px); /* Gentle lift effect on hover */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .theme-image {
      width: 100%;
      height: 100%;
      object-fit: cover; 
    }

    /* Text block below the photos */
    .theme-text {
      font-size: 15px;
      line-height: 1.6;
      text-align: justify;
      color: #222222;
      margin: 0;
      padding: 0 10px;
    }

    .theme-subtitle {
      font-size: 1.2rem;
      color: #023743FF;
      margin: 0 0 10px 0;
      text-align: center;
    }
  </style>

  <div class="header">
    <a href="https://wjdaniel.github.io/home/" class="header-brand">Daniel Lee</a>

    <div class="header-nav">
      <a href="https://wjdaniel.github.io/home/" class="header-button">Home</a>
      <a href="https://wjdaniel.github.io/home/projects" class="header-button">Projects</a>
      <a href="https://wjdaniel.github.io/home/cv" class="header-button">CV</a>
      <a href="https://wjdaniel.github.io/home/life" class="header-button">Field Photos</a>
    </div>
  </div>

  <div class="content-container">
    <h1 class="page-title">Themes</h1>

    <div class="theme-grid">
      
      <div class="theme-column">
        <a href="https://wjdaniel.github.io/home/theme1" class="image-link">
          <img class="theme-image" src="./images/DiffusionFig.png" alt="Theme 1 Visual">
        </a>
        <h2 class="theme-subtitle">Linking Petrology to Geophysical Monitoring</h2>
        <p class="theme-text"></p>
      </div>

      <div class="theme-column">
        <a href="https://wjdaniel.github.io/home/theme2" class="image-link">
          <img class="theme-image" src="./images/NLD-63-01-Ol01.jpg" alt="Theme 2 Visual">
        </a>
        <h2 class="theme-subtitle">Volatile Recycling at Subduction Zones</h2>
        <p class="theme-text"></p>
      </div>

      <div class="theme-column">
        <a href="https://wjdaniel.github.io/home/theme3" class="image-link">
          <img class="theme-image" src="./images/IMG_2558.jpg" alt="Theme 3 Visual">
        </a>
        <h2 class="theme-subtitle">High-PT Experiments</h2>
        <p class="theme-text"></p>
      </div>

      <div class="theme-column">
        <a href="https://wjdaniel.github.io/home/theme4" class="image-link">
          <img class="theme-image" src="./images/AT3742-Plag-T09.jpg" alt="Theme 3 Visual">
        </a>
        <h2 class="theme-subtitle">Trace Elements</h2>
        <p class="theme-text"></p>
      </div>

            <div class="theme-column">
        <a href="https://wjdaniel.github.io/home/theme5" class="image-link">
          <img class="theme-image" src="./images/MIModel.png" alt="Theme 3 Visual">
        </a>
        <h2 class="theme-subtitle">Computational Models</h2>
        <p class="theme-text"></p>
      </div>


    </div>
  </div>

</body>
</html>
